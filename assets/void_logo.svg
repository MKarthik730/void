<svg width="500" height="500" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
<rect width="680" height="680" fill="#010d1a"/>
<defs>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0af" stop-opacity="0.9"/>
    <stop offset="40%" stop-color="#048" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#001020" stop-opacity="1"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0af" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0af" stop-opacity="0"/>
  </radialGradient>

  <style>
    .logo-group {
      animation: popUp 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transform-origin: 340px 340px;
    }
    @keyframes popUp {
      0%   { opacity: 0; transform: translateY(60px) scale(0.75); }
      60%  { opacity: 1; transform: translateY(-10px) scale(1.04); }
      80%  { transform: translateY(5px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0px) scale(1); }
    }
  </style>
</defs>

