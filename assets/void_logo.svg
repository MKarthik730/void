<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 736" width="736" height="736">
  <defs>
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </radialGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eeeeee"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="streakGlow" x="-30%" y="-400%" width="160%" height="900%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="streakFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="82%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="736" height="736" fill="#000000"/>

  <!-- scattered stars -->
  <g fill="#ffffff">
    <circle cx="62" cy="48" r="1.4" opacity="0.8"/>
    <circle cx="140" cy="112" r="1" opacity="0.5"/>
    <circle cx="210" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="330" cy="70" r="1" opacity="0.5"/>
    <circle cx="420" cy="35" r="1.3" opacity="0.8"/>
    <circle cx="520" cy="90" r="1" opacity="0.6"/>
    <circle cx="610" cy="55" r="1.4" opacity="0.7"/>
    <circle cx="680" cy="120" r="1" opacity="0.5"/>
    <circle cx="30" cy="200" r="1.2" opacity="0.6"/>
    <circle cx="100" cy="260" r="1" opacity="0.5"/>
    <circle cx="670" cy="220" r="1.3" opacity="0.7"/>
    <circle cx="700" cy="300" r="1" opacity="0.5"/>
    <circle cx="40" cy="400" r="1.2" opacity="0.6"/>
    <circle cx="20" cy="500" r="1" opacity="0.5"/>
    <circle cx="700" cy="450" r="1.3" opacity="0.7"/>
    <circle cx="690" cy="560" r="1" opacity="0.5"/>
    <circle cx="80" cy="600" r="1.2" opacity="0.6"/>
    <circle cx="150" cy="670" r="1" opacity="0.5"/>
    <circle cx="250" cy="700" r="1.3" opacity="0.7"/>
    <circle cx="350" cy="660" r="1" opacity="0.5"/>
    <circle cx="450" cy="700" r="1.2" opacity="0.6"/>
    <circle cx="550" cy="660" r="1" opacity="0.5"/>
    <circle cx="620" cy="700" r="1.3" opacity="0.7"/>
    <circle cx="380" cy="150" r="1" opacity="0.5"/>
    <circle cx="470" cy="180" r="1.2" opacity="0.6"/>
    <circle cx="180" cy="180" r="1" opacity="0.5"/>
    <circle cx="90" cy="350" r="1.2" opacity="0.6"/>
    <circle cx="640" cy="380" r="1" opacity="0.5"/>
    <circle cx="120" cy="480" r="1.1" opacity="0.6"/>
    <circle cx="600" cy="520" r="1" opacity="0.5"/>
    <circle cx="260" cy="90" r="1" opacity="0.5"/>
    <circle cx="580" cy="150" r="1.1" opacity="0.6"/>
  </g>

  <!-- V : measured bbox x165-269, y331-417, stroke ~13 -->
  <path d="M 165,331 L 217,417 L 269,331" fill="none" stroke="url(#letterGrad)"
        stroke-width="13" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- I : measured bbox x432-441 (w9), y331-417 -->
  <rect x="432" y="331" width="9" height="86" fill="url(#letterGrad)"/>

  <!-- D : left stroke x487-499 (w12,center493), bowl reaching x563 at mid-height y374 -->
  <path d="M 493,331 L 493,417
           C 528,417 557,400 557,374
           C 557,348 528,331 493,331 Z"
        fill="none" stroke="url(#letterGrad)" stroke-width="13" stroke-linejoin="round"/>

  <!-- O : black-hole ring, center (330,373), outer r ~48 -->
  <g filter="url(#softGlow)">
    <!-- faint outer lensed ring for depth -->
    <circle cx="330" cy="373" r="45" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
    <!-- main ring -->
    <circle cx="330" cy="373" r="41" fill="none" stroke="url(#ringGrad)" stroke-width="8"/>
    <!-- dark core matches background -->
    <circle cx="330" cy="373" r="36" fill="#000000"/>
  </g>

  <!-- accretion streak crossing through the ring's middle, tapering out past both sides -->
  <g filter="url(#streakGlow)">
    <rect x="213" y="371" width="228" height="4" fill="url(#streakFade)"/>
  </g>
  <rect x="240" y="372.8" width="180" height="1.4" fill="#ffffff" opacity="0.95"/>
</svg>
